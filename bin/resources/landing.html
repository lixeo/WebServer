<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎 - TinyWebServer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            color: white;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .buttons a {
            display: inline-block;
            padding: 12px 30px;
            margin: 0 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 40px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login {
            background-color: #fff;
            color: #764ba2;
            border: none;
        }
        .btn-register {
            background-color: transparent;
            color: #fff;
            border: 2px solid #fff;
        }
        .buttons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到 TinyWebServer</h1>
        <div class="buttons">
            <a href="/login.html" class="btn-login">登录</a>
            <a href="/register.html" class="btn-register">注册</a>
        </div>
    </div>
    <footer>© 2025 TinyWebServer</footer>
</body>
</html>
