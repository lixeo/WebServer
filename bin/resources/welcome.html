<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>欢迎</title>
    <script>
        // 从 URL 参数获取用户名
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        if (username) {
            localStorage.setItem('loggedInUser', username);
        }
        // 跳转到主页
        window.location.href = '/index.html';
    </script>
</head>
<body>正在跳转...</body>
</html>
