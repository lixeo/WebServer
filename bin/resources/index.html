<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JehanRio-首页</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 头像下拉菜单样式 */
        .avatar-dropdown {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        .avatar-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 120px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 8px;
            overflow: hidden;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        .avatar-dropdown:hover .dropdown-content {
            display: block;
        }
        /* 调整导航栏右侧位置 */
        .navbar-right {
            margin-right: 20px;
        }
        .navbar-right li {
            list-style: none;
            float: left;
        }
        .navbar-right .avatar-li {
            padding: 8px 0 0 15px;
        }
    </style>
</head>
<body data-spy="scroll" data-target=".navbar-collapse" data-offset="50">

    <!-- PRE LOADER -->
    <div class="preloader">
        <div class="spinner">
            <span class="spinner-rotate"></span>
        </div>
    </div>

    <!-- NAVIGATION SECTION -->
    <div class="navbar custom-navbar navbar-fixed-top" role="navigation">
        <div class="container">
            <div class="navbar-header">
                <button class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon icon-bar"></span>
                    <span class="icon icon-bar"></span>
                    <span class="icon icon-bar"></span>
                </button>
                <a href="/" class="navbar-brand">JehanRio</a>
            </div>
            <div class="collapse navbar-collapse">
                <ul class="nav navbar-nav navbar-right" id="nav-list">
                    <!-- 动态填充：首页、图片、视频 -->
                    <li><a class="smoothScroll" href="/">首页</a></li>
                    <li><a class="smoothScroll" href="/picture">图片</a></li>
                    <li><a class="smoothScroll" href="/video">视频</a></li>
                    <!-- 登录/注册或头像会通过 JS 动态添加到这里 -->
                </ul>
            </div>
        </div>
    </div>

    <!-- HOME SECTION -->
    <section id="home">
        <div class="container">
            <div class="row">
                <div class="col-md-offset-1 col-md-2 col-sm-3">
                    <img src="images/profile-image.jpg" class="wow fadeInUp img-responsive img-circle"
                         data-wow-delay="0.2s" alt="about image">
                </div>
                <div class="col-md-8 col-sm-8">
                    <h1 class="wow fadeInUp" data-wow-delay="0.6s">你好，这是首页。</h1>                    
                </div>
            </div>
        </div>
    </section>

    <!-- SCRIPTS -->
    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/smoothscroll.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/magnific-popup-options.js"></script>
    <script src="js/wow.min.js"></script>
    <script src="js/custom.js"></script>

    <script>
        // 从 localStorage 读取当前登录的用户名
        let currentUser = localStorage.getItem('loggedInUser');

        // 如果没有登录，跳转到 landing.html
        if (!currentUser) {
            window.location.href = '/landing.html';
        }

        // 获取用户信息并显示头像
        async function loadUserAvatar(username) {
            try {
                const response = await fetch(`/api/user/info?username=${encodeURIComponent(username)}`);
                const data = await response.json();
                if (data.code === 200) {
                    const avatarUrl = data.data.avatar && data.data.avatar.trim() !== '' ? data.data.avatar : '/images/default-avatar.png';
                    // 动态添加头像到导航栏
                    const navList = document.getElementById('nav-list');
                    // 移除可能已存在的登录/注册链接（如果有）
                    const existingAuth = document.querySelector('.auth-li');
                    if (existingAuth) existingAuth.remove();
                    // 添加头像下拉菜单
                    const avatarLi = document.createElement('li');
                    avatarLi.className = 'avatar-li';
                    avatarLi.innerHTML = `
                        <div class="avatar-dropdown">
                            <img src="${avatarUrl}" class="avatar-img" alt="avatar" onerror="this.src='/images/default-avatar.png'">
                            <div class="dropdown-content">
                                <a href="/profile.html?username=${username}">个人资料</a>
                                <a href="#" id="logoutBtn">退出登录</a>
                            </div>
                        </div>
                    `;
                    navList.appendChild(avatarLi);
                    // 退出登录逻辑
                    document.getElementById('logoutBtn').addEventListener('click', function(e) {
                        e.preventDefault();
                        localStorage.removeItem('loggedInUser');
                        window.location.href = '/landing.html';
                    });
                } else {
                    console.error('Failed to load user info');
                }
            } catch (err) {
                console.error('Network error:', err);
            }
        }

        // 如果已登录，加载头像
        if (currentUser) {
            loadUserAvatar(currentUser);
        }
    </script>
</body>
</html>
